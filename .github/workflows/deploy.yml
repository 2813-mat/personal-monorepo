name: Deploy Financeiro

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          KC_DB_USERNAME=${{ secrets.KC_DB_USERNAME }}
          KC_DB_PASSWORD=${{ secrets.KC_DB_PASSWORD }}
          KC_ADMIN_USERNAME=${{ secrets.KC_ADMIN_USERNAME }}
          KC_ADMIN_PASSWORD=${{ secrets.KC_ADMIN_PASSWORD }}
          WEB_ORIGIN=${{ secrets.WEB_ORIGIN }}
          KEYCLOAK_PUBLIC_URL=${{ secrets.KEYCLOAK_PUBLIC_URL }}
          KEYCLOAK_REALM=${{ secrets.KEYCLOAK_REALM }}
          KEYCLOAK_CLIENT_ID=${{ secrets.KEYCLOAK_CLIENT_ID }}
          UI_API_BASE_URL=${{ secrets.UI_API_BASE_URL }}
          UI_AUTH_AUTHORITY=${{ secrets.UI_AUTH_AUTHORITY }}
          UI_AUTH_CLIENT_ID=${{ secrets.UI_AUTH_CLIENT_ID }}
          EOF

      - name: Build and restart containers
        run: |
          docker compose -f docker-compose.prod.yml build --no-cache
          docker compose -f docker-compose.prod.yml up -d

      - name: Reload infra nginx
        run: |
          # Containers do stack são recriados a cada deploy e trocam de IP na rede
          # infra; o infra-nginx cacheia o IP antigo no proxy_pass e passa a
          # devolver 502 até ser recarregado.
          docker exec infra-nginx nginx -s reload
