server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: todas as rotas vão para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gerado em runtime (docker/40-generate-config.sh): nunca cachear
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Revalidar sempre: é o que referencia os bundles com hash. Em cache, o app
    # instalado na tela de início ficaria preso em uma versão antiga.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/manifest+json application/javascript text/xml application/xml text/javascript;
}
